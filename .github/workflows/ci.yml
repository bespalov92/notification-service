name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      POSTGRES_DB_NAME: notification_test
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: notification_test
          POSTGRES_USER: notification
          POSTGRES_PASSWORD: notification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notification -d notification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Pytest
        run: |
          uv run pytest
